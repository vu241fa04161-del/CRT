{% extends 'quiz/base.html' %}

{% block content %}

<style>
    /* Glass Auth Card */
    .register-container {
        max-width: 500px;
        width: 100%;
        margin: 60px auto;
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 45px 35px;
        border-radius: 24px;
        box-shadow: var(--glass-shadow);
        animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .register-container h2 {
        text-align: center;
        margin-bottom: 30px;
        color: #ffffff;
        font-weight: 800;
        font-size: 2rem;
    }

    .form-group {
        margin-bottom: 22px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: var(--text-secondary);
        font-size: 0.95rem;
    }

    .error {
        color: #f87171;
        font-size: 0.90rem;
        margin-top: 8px;
        font-weight: 600;
        text-align: center;
    }

    /* Bottom Login link */
    .login-text {
        text-align: center;
        margin-top: 25px;
        color: var(--text-secondary);
        font-size: 0.9rem;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        padding-top: 20px;
    }

    .login-link {
        color: #60a5fa;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.3s ease;
        margin-left: 4px;
    }

    .login-link:hover {
        color: #a855f7;
        text-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
    }

    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media(max-width: 550px) {
        .register-container {
            width: 95%;
            padding: 30px 20px;
        }
    }
</style>

<div class="register-container">

    <h2>🚀 Create Account</h2>

    <form method="POST" id="registerForm">
        {% csrf_token %}

        <!-- Error Messages -->
        <div id="djangoMessage" class="error">
            {% if messages %}
                {% for message in messages %}
                    {{ message }}
                {% endfor %}
            {% endif %}
        </div>

        <!-- Username -->
        <div class="form-group">
            <label for="id_username">Username</label>
            <input
                type="text"
                name="username"
                id="id_username"
                class="form-control"
                placeholder="Choose a username"
                required>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="id_email">Email Address</label>
            <input
                type="email"
                name="email"
                id="id_email"
                class="form-control"
                placeholder="Enter your email"
                required>
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="id_password1">Password</label>
            <input
                type="password"
                name="password1"
                id="id_password1"
                class="form-control"
                placeholder="Create password"
                required>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
            <label for="id_password2">Confirm Password</label>
            <input
                type="password"
                name="password2"
                id="id_password2"
                class="form-control"
                placeholder="Re-enter password"
                required>
        </div>

        <!-- Javascript Validation Message -->
        <div id="message" class="error"></div>

        <!-- Register Button -->
        <button type="submit" class="btn btn-success w-100 py-3 mt-3">
            Register Account ✍️
        </button>

        <!-- Login Link -->
        <div class="login-text">
            Already have an account?
            <a href="/login/" class="login-link">Login Here 🔐</a>
        </div>

    </form>

</div>

<script>
    // Form Password Match Validation
    document.getElementById("registerForm").addEventListener("submit", function(e) {
        var password1 = document.getElementById("id_password1");
        var password2 = document.getElementById("id_password2");
        var message = document.getElementById("message");

        if (password1.value !== password2.value) {
            e.preventDefault();
            message.innerHTML = "❌ Passwords do not match!";
        } else {
            message.innerHTML = "";
        }
    });

    // Input Scaling animation
    const inputs = document.querySelectorAll(".form-control");
    inputs.forEach(input => {
        input.addEventListener("focus", () => {
            input.style.transform = "scale(1.015)";
        });
        input.addEventListener("blur", () => {
            input.style.transform = "scale(1)";
        });
    });
</script>

{% endblock %}
