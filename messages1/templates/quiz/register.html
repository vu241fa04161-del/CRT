{% extends 'quiz/base.html' %}

{% block content %}

<style>
    /* Glass Auth Card */
    .register-container {
        max-width: 500px;
        width: 100%;
        margin: 60px auto;
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 45px 35px;
        border-radius: 24px;
        box-shadow: var(--glass-shadow);
        animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .register-container h2 {
        text-align: center;
        margin-bottom: 30px;
        color: #ffffff;
        font-weight: 800;
        font-size: 2rem;
    }

    .form-group {
        margin-bottom: 22px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: var(--text-secondary);
        font-size: 0.95rem;
    }

    .error {
        color: #f87171;
        font-size: 0.90rem;
        margin-top: 8px;
        font-weight: 600;
        text-align: center;
    }

    /* Bottom Login link */
    .login-text {
        text-align: center;
        margin-top: 25px;
        color: var(--text-secondary);
        font-size: 0.9rem;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        padding-top: 20px;
    }

    .login-link {
        color: #60a5fa;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.3s ease;
        margin-left: 4px;
    }

    .login-link:hover {
        color: #a855f7;
        text-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
    }

    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media(max-width: 550px) {
        .register-container {
            width: 95%;
            padding: 30px 20px;
        }
    }

    /* Google Button and Separator */
    .or-separator {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 20px 0;
        color: var(--text-muted);
        font-size: 0.9rem;
    }
    .or-separator::before, .or-separator::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .or-separator:not(:empty)::before {
        margin-right: .5em;
    }
    .or-separator:not(:empty)::after {
        margin-left: .5em;
    }

    .btn-google {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: #ffffff;
        border-radius: 12px;
        padding: 12px 24px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        cursor: pointer;
        width: 100%;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    .btn-google:hover {
        background: rgba(255, 255, 255, 0.07);
        border-color: rgba(255, 255, 255, 0.18);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 255, 255, 0.05);
    }
</style>

<div class="register-container">

    <h2>🚀 Create Account</h2>

    <form method="POST" id="registerForm">
        {% csrf_token %}

        <!-- Error Messages -->
        <div id="djangoMessage" class="error">
            {% if messages %}
                {% for message in messages %}
                    {{ message }}
                {% endfor %}
            {% endif %}
        </div>

        <!-- Username -->
        <div class="form-group">
            <label for="id_username">Username</label>
            <input
                type="text"
                name="username"
                id="id_username"
                class="form-control"
                placeholder="Choose a username"
                required>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="id_email">Email Address</label>
            <input
                type="email"
                name="email"
                id="id_email"
                class="form-control"
                placeholder="Enter your email"
                required>
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="id_password1">Password</label>
            <input
                type="password"
                name="password1"
                id="id_password1"
                class="form-control"
                placeholder="Create password"
                required>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
            <label for="id_password2">Confirm Password</label>
            <input
                type="password"
                name="password2"
                id="id_password2"
                class="form-control"
                placeholder="Re-enter password"
                required>
        </div>

        <!-- Javascript Validation Message -->
        <div id="message" class="error"></div>

        <!-- Register Button -->
        <button type="submit" class="btn btn-success w-100 py-3 mt-3">
            Register Account ✍️
        </button>

        <!-- Or Separator -->
        <div class="or-separator">
            <span>or</span>
        </div>

        <!-- Google Login Button -->
        <button type="button" class="btn-google" onclick="handleGoogleLogin()">
            <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48" class="me-2" style="display: inline-block; vertical-align: middle;">
                <g>
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                    <path fill="#4285F4" d="M46.5 24c0-1.63-.15-3.2-.43-4.75H24v9h12.75c-.55 2.85-2.17 5.27-4.59 6.89l7.15 5.54C43.5 35.88 46.5 30.47 46.5 24z"></path>
                    <path fill="#34A853" d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.98-6.19z"></path>
                    <path fill="#FBBC05" d="M24 38.5c-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48c5.45 0 10.45-1.79 14.25-4.87l-7.1-5.51c-2 .88-4.52 1.38-7.15 1.38z"></path>
                </g>
            </svg>
            Continue with Google
        </button>

        <!-- Login Link -->
        <div class="login-text">
            Already have an account?
            <a href="/login/" class="login-link">Login Here 🔐</a>
        </div>

    </form>

</div>

<script>
    // Form Password Match Validation
    document.getElementById("registerForm").addEventListener("submit", function(e) {
        var password1 = document.getElementById("id_password1");
        var password2 = document.getElementById("id_password2");
        var message = document.getElementById("message");

        if (password1.value !== password2.value) {
            e.preventDefault();
            message.innerHTML = "❌ Passwords do not match!";
        } else {
            message.innerHTML = "";
        }
    });

    // Input Scaling animation
    const inputs = document.querySelectorAll(".form-control");
    inputs.forEach(input => {
        input.addEventListener("focus", () => {
            input.style.transform = "scale(1.015)";
        });
        input.addEventListener("blur", () => {
            input.style.transform = "scale(1)";
        });
    });

    // Simulated Google OAuth registration
    function handleGoogleLogin() {
        alert("🔗 Redirecting to Google Authentication...");
        window.location.href = "/dashboard/";
    }
</script>

{% endblock %}
