{% extends 'quiz/base.html' %}

{% block content %}

<style>
    /* Glass Auth Card */
    .login-container {
        max-width: 450px;
        width: 100%;
        margin: 60px auto;
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 45px 35px;
        border-radius: 24px;
        box-shadow: var(--glass-shadow);
        animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-container h2 {
        text-align: center;
        margin-bottom: 30px;
        color: #ffffff;
        font-weight: 800;
        font-size: 2rem;
    }

    .mb-3 {
        margin-bottom: 24px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: var(--text-secondary);
        font-size: 0.95rem;
    }

    .error-message {
        color: #f87171;
        text-align: center;
        margin-bottom: 20px;
        font-size: 0.9rem;
        font-weight: 600;
    }

    .show-password {
        margin-top: 12px;
        font-size: 0.9rem;
        color: var(--text-secondary);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .show-password input {
        cursor: pointer;
        accent-color: #60a5fa;
    }

    /* Bottom Links */
    .bottom-links {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 25px;
        font-size: 0.9rem;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        padding-top: 20px;
    }

    .bottom-links a {
        text-decoration: none;
        font-weight: 600;
        color: #60a5fa;
        transition: all 0.3s ease;
    }

    .bottom-links a:hover {
        color: #a855f7;
        text-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
    }

    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media(max-width: 500px) {
        .login-container {
            width: 95%;
            padding: 30px 20px;
        }
    }

    /* Google Button and Separator */
    .or-separator {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 20px 0;
        color: var(--text-muted);
        font-size: 0.9rem;
    }
    .or-separator::before, .or-separator::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .or-separator:not(:empty)::before {
        margin-right: .5em;
    }
    .or-separator:not(:empty)::after {
        margin-left: .5em;
    }

    .btn-google {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: #ffffff;
        border-radius: 12px;
        padding: 12px 24px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        cursor: pointer;
        width: 100%;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    .btn-google:hover {
        background: rgba(255, 255, 255, 0.07);
        border-color: rgba(255, 255, 255, 0.18);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 255, 255, 0.05);
    }
</style>

<div class="login-container">

    <h2>🔐 Login</h2>

    <form method="POST" id="loginForm">
        {% csrf_token %}

        <!-- Error Messages -->
        <div id="error" class="error-message">
            {% if messages %}
                {% for message in messages %}
                    {{ message }}
                {% endfor %}
            {% endif %}
        </div>

        <!-- Username -->
        <div class="mb-3">
            <label for="username">Username</label>
            <input type="text"
                   name="username"
                   id="username"
                   class="form-control"
                   placeholder="Enter your username"
                   required>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label for="password">Password</label>
            <input type="password"
                   name="password"
                   id="password"
                   class="form-control"
                   placeholder="Enter your password"
                   required>

            <div class="show-password">
                <input type="checkbox" id="togglePassword">
                <label for="togglePassword" class="mb-0" style="font-weight: 500; cursor: pointer;">Show Password</label>
            </div>
        </div>

        <!-- Login Button -->
        <button type="submit" class="btn btn-primary w-100 py-3 mt-2">
            Sign In 🚀
        </button>

        <!-- Or Separator -->
        <div class="or-separator">
            <span>or</span>
        </div>

        <!-- Google Login Button -->
        <button type="button" class="btn-google" onclick="handleGoogleLogin()">
            <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48" class="me-2" style="display: inline-block; vertical-align: middle;">
                <g>
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                    <path fill="#4285F4" d="M46.5 24c0-1.63-.15-3.2-.43-4.75H24v9h12.75c-.55 2.85-2.17 5.27-4.59 6.89l7.15 5.54C43.5 35.88 46.5 30.47 46.5 24z"></path>
                    <path fill="#34A853" d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.98-6.19z"></path>
                    <path fill="#FBBC05" d="M24 38.5c-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48c5.45 0 10.45-1.79 14.25-4.87l-7.1-5.51c-2 .88-4.52 1.38-7.15 1.38z"></path>
                </g>
            </svg>
            Continue with Google
        </button>

        <!-- Bottom Links -->
        <div class="bottom-links">
            <a href="/forgetpassword/">🔑 Forgot Password?</a>
            <a href="/register/">✍️ Register Account</a>
        </div>

    </form>

</div>

<script>
    // Show / Hide Password
    const togglePassword = document.getElementById("togglePassword");
    const password = document.getElementById("password");

    togglePassword.addEventListener("change", function () {
        if (password.type === "password") {
            password.type = "text";
        } else {
            password.type = "password";
        }
    });

    // Form Client-side Validation
    document.getElementById("loginForm").addEventListener("submit", function(e) {
        let username = document.getElementById("username").value.trim();
        let passwordValue = password.value.trim();
        let error = document.getElementById("error");

        if (username === "" || passwordValue === "") {
            e.preventDefault();
            error.innerText = "Please fill in all fields!";
        } else {
            error.innerText = "";
        }
    });

    // Input Focus Visual Scaling
    const inputs = document.querySelectorAll(".form-control");
    inputs.forEach(input => {
        input.addEventListener("focus", () => {
            input.style.transform = "scale(1.015)";
        });
        input.addEventListener("blur", () => {
            input.style.transform = "scale(1)";
        });
    });

    // Simulated Google OAuth login
    function handleGoogleLogin() {
        alert("🔗 Redirecting to Google Authentication...");
        window.location.href = "/dashboard/";
    }
</script>

{% endblock %}
