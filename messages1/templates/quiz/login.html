{% extends 'quiz/base.html' %}

{% block content %}

<style>
    /* Glass Auth Card */
    .login-container {
        max-width: 450px;
        width: 100%;
        margin: 60px auto;
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 45px 35px;
        border-radius: 24px;
        box-shadow: var(--glass-shadow);
        animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-container h2 {
        text-align: center;
        margin-bottom: 30px;
        color: #ffffff;
        font-weight: 800;
        font-size: 2rem;
    }

    .mb-3 {
        margin-bottom: 24px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: var(--text-secondary);
        font-size: 0.95rem;
    }

    .error-message {
        color: #f87171;
        text-align: center;
        margin-bottom: 20px;
        font-size: 0.9rem;
        font-weight: 600;
    }

    .show-password {
        margin-top: 12px;
        font-size: 0.9rem;
        color: var(--text-secondary);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .show-password input {
        cursor: pointer;
        accent-color: #60a5fa;
    }

    /* Bottom Links */
    .bottom-links {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 25px;
        font-size: 0.9rem;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        padding-top: 20px;
    }

    .bottom-links a {
        text-decoration: none;
        font-weight: 600;
        color: #60a5fa;
        transition: all 0.3s ease;
    }

    .bottom-links a:hover {
        color: #a855f7;
        text-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
    }

    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media(max-width: 500px) {
        .login-container {
            width: 95%;
            padding: 30px 20px;
        }
    }
</style>

<div class="login-container">

    <h2>🔐 Login</h2>

    <form method="POST" id="loginForm">
        {% csrf_token %}

        <!-- Error Messages -->
        <div id="error" class="error-message">
            {% if messages %}
                {% for message in messages %}
                    {{ message }}
                {% endfor %}
            {% endif %}
        </div>

        <!-- Username -->
        <div class="mb-3">
            <label for="username">Username</label>
            <input type="text"
                   name="username"
                   id="username"
                   class="form-control"
                   placeholder="Enter your username"
                   required>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label for="password">Password</label>
            <input type="password"
                   name="password"
                   id="password"
                   class="form-control"
                   placeholder="Enter your password"
                   required>

            <div class="show-password">
                <input type="checkbox" id="togglePassword">
                <label for="togglePassword" class="mb-0" style="font-weight: 500; cursor: pointer;">Show Password</label>
            </div>
        </div>

        <!-- Login Button -->
        <button type="submit" class="btn btn-primary w-100 py-3 mt-2">
            Sign In 🚀
        </button>

        <!-- Bottom Links -->
        <div class="bottom-links">
            <a href="/forgetpassword/">🔑 Forgot Password?</a>
            <a href="/register/">✍️ Register Account</a>
        </div>

    </form>

</div>

<script>
    // Show / Hide Password
    const togglePassword = document.getElementById("togglePassword");
    const password = document.getElementById("password");

    togglePassword.addEventListener("change", function () {
        if (password.type === "password") {
            password.type = "text";
        } else {
            password.type = "password";
        }
    });

    // Form Client-side Validation
    document.getElementById("loginForm").addEventListener("submit", function(e) {
        let username = document.getElementById("username").value.trim();
        let passwordValue = password.value.trim();
        let error = document.getElementById("error");

        if (username === "" || passwordValue === "") {
            e.preventDefault();
            error.innerText = "Please fill in all fields!";
        } else {
            error.innerText = "";
        }
    });

    // Input Focus Visual Scaling
    const inputs = document.querySelectorAll(".form-control");
    inputs.forEach(input => {
        input.addEventListener("focus", () => {
            input.style.transform = "scale(1.015)";
        });
        input.addEventListener("blur", () => {
            input.style.transform = "scale(1)";
        });
    });
</script>

{% endblock %}
