{% extends 'quiz/base.html' %}

{% block content %}

<style>
    /* Glass Auth Card */
    .forgot-container {
        max-width: 450px;
        width: 100%;
        margin: 80px auto;
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 45px 35px;
        border-radius: 24px;
        box-shadow: var(--glass-shadow);
        animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .forgot-container h2 {
        text-align: center;
        margin-bottom: 12px;
        color: #ffffff;
        font-weight: 800;
        font-size: 2rem;
    }

    .forgot-container p {
        text-align: center;
        color: var(--text-secondary);
        margin-bottom: 30px;
        font-size: 0.95rem;
        line-height: 1.5;
    }

    .form-group {
        margin-bottom: 24px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: var(--text-secondary);
        font-size: 0.95rem;
    }

    .success-message {
        color: #34d399;
        text-align: center;
        margin-bottom: 20px;
        font-size: 0.95rem;
        font-weight: 600;
    }

    .error-message {
        color: #f87171;
        text-align: center;
        margin-bottom: 20px;
        font-size: 0.95rem;
        font-weight: 600;
    }

    /* Bottom Login link */
    .bottom-links {
        text-align: center;
        margin-top: 25px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        padding-top: 20px;
    }

    .bottom-links a {
        text-decoration: none;
        font-weight: 600;
        color: #60a5fa;
        transition: all 0.3s ease;
    }

    .bottom-links a:hover {
        color: #a855f7;
        text-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
    }

    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media(max-width: 500px) {
        .forgot-container {
            width: 95%;
            padding: 30px 20px;
        }
    }
</style>

<div class="forgot-container">

    <h2>🔑 Reset Password</h2>
    <p>Enter your registered email address below, and we will send you instructions to reset your password.</p>

    <form method="POST" id="forgotForm">
        {% csrf_token %}

        <!-- Success Message -->
        <div id="success" class="success-message"></div>

        <!-- Error Message -->
        <div id="error" class="error-message"></div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                name="email"
                id="email"
                class="form-control"
                placeholder="Enter your registered email"
                required>
        </div>

        <!-- Reset Button -->
        <button type="submit" class="btn btn-primary w-100 py-3 mt-2">
            Send Reset Instructions 📧
        </button>

        <!-- Bottom Links -->
        <div class="bottom-links">
            <a href="/login/">🔐 Back to Login Screen</a>
        </div>

    </form>

</div>

<script>
    // Form Validation
    document.getElementById("forgotForm").addEventListener("submit", function(e) {
        let email = document.getElementById("email").value.trim();
        let error = document.getElementById("error");
        let success = document.getElementById("success");

        if (email === "") {
            e.preventDefault();
            error.innerHTML = "❌ Please enter your email address.";
            success.innerHTML = "";
        } else {
            e.preventDefault(); // Simulate sending for preview
            error.innerHTML = "";
            success.innerHTML = "📨 Reset link sent successfully!";
        }
    });

    // Input Focus Visual Scale
    const input = document.getElementById("email");
    input.addEventListener("focus", () => {
        input.style.transform = "scale(1.015)";
    });
    input.addEventListener("blur", () => {
        input.style.transform = "scale(1)";
    });
</script>

{% endblock %}
